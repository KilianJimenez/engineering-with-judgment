<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="{{T.description}}" />
    <title>{{TITLE}}</title>
    <script type="application/json" id="lang-map">{{LANG_MAP}}</script>
    <script>
      // Picks the language before first paint: saved choice, else browser language (Spanish → es, anything else → en).
      (() => {
        const current = document.documentElement.lang;
        let lang;
        try { lang = localStorage.getItem('manifiesto-idioma'); } catch { /* storage unavailable */ }
        if (lang !== 'es' && lang !== 'en') lang = /^es\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'es' : 'en';
        if (lang === current) return;
        const map = JSON.parse(document.getElementById('lang-map').textContent);
        const id = map.ids[decodeURIComponent(location.hash.slice(1))];
        location.replace(map.href + (id ? `#${id}` : ''));
      })();
    </script>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      (() => {
        let theme;
        try { theme = localStorage.getItem('manifiesto-tema'); } catch { /* storage unavailable */ }
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#10141a' : '#f3f5f9';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#{{FIRST_ID}}">{{T.skip}}</a>
    <div class="reading-progress" role="progressbar" aria-label="{{T.progress}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
    <div class="toolbar">
      <nav class="lang-switch" aria-label="{{T.language}}">{{LANG_SWITCH}}</nav>
      <button class="toolbar-button index-toggle" type="button" aria-haspopup="dialog" aria-controls="chapter-index" data-open-index hidden>{{T.index}} <span class="menu-icon" aria-hidden="true"><i></i><i></i></span></button>
      <button class="toolbar-button mode-toggle" type="button" data-mode-toggle hidden aria-label="{{T.toDark}}" data-label-dark="{{T.dark}}" data-label-light="{{T.light}}" data-aria-dark="{{T.toDark}}" data-aria-light="{{T.toLight}}">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="mode-label">{{T.dark}}</span>
      </button>
    </div>

    <main id="contenido">
      <section id="inicio" class="hero" data-contrast aria-labelledby="manifesto-title">
        <div class="hero-inner">
          <h1 class="hero-kicker" id="manifesto-title">{{TITLE}}</h1>
          <p class="hero-heading">{{T.heroHeading}}</p>
          <p class="hero-description">{{T.heroDescription}}</p>
        </div>
        <nav class="hero-toc" aria-label="{{T.sections}}">{{TOC}}</nav>
      </section>
      <div id="manifesto-content">{{SECTIONS}}</div>
    </main>

    <dialog id="chapter-index" aria-labelledby="index-title" data-lenis-prevent>
      <div class="index-header"><span class="index-eyebrow">{{T.eyebrow}}</span><button class="close-index" type="button" aria-label="{{T.closeIndex}}">{{T.close}} <span aria-hidden="true">×</span></button></div>
      <h2 id="index-title">{{T.index}}</h2>
      <nav class="index-links" aria-label="{{T.indexNav}}">{{INDEX}}</nav>
      <a class="index-download" href="/{{SOURCE}}" download data-download>{{T.download}} <span aria-hidden="true">↓</span></a>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
