name: Firma

# pull_request_target runs in the context of the base repository so it works for forks.
# Security: the PR code is never checked out or executed. Only the base branch is checked out
# (for the validator) and the PR is read through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['signatures/**']

concurrency:
  group: firma-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar firma
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: validate
        run: node scripts/validate-signature.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - name: Comentar el motivo
        if: failure() && steps.validate.outputs.errors != ''
        run: |
          {
            echo "No se ha podido integrar la firma automáticamente:"
            echo
            echo "$ERRORS"
            echo
            echo "Corrige el fichero con un nuevo commit en este PR. Formato: [signatures/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/signatures/README.md)."
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERRORS: ${{ steps.validate.outputs.errors }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Separate job: the "Validar firma" check must be complete (green) before main's protection allows the merge.
  integrar:
    name: Integrar firma
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Integrar
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" --subject "Firma: $PR_AUTHOR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Merges made with GITHUB_TOKEN do not trigger `push`, so the site is redeployed from here.
  desplegar:
    needs: integrar
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
